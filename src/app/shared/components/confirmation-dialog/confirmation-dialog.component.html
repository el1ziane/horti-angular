<mat-dialog-content>
  <p>{{data}}</p>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button  mat-raised-button (click)="onConfirm(true)" style="color: #64C2A8">Sim</button>
  <button  mat-raised-button (click)="onConfirm(false)" style="color: #D66767">Não</button>
</mat-dialog-actions>
