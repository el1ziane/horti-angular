<mat-card>
  <mat-card-header>
    <mat-card-title>Detalhes do Produto</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" class="form-columns">
      <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Código</mat-label>
          <input matInput formControlName="codigo" placeholder="Código" id="codigo" name="codigo">
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Produto</mat-label>
          <input matInput formControlName="produtoNome" placeholder="Produto" id="produtoNome" name="produtoNome">
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Peso</mat-label>
          <input matInput type="number" formControlName="peso" class="example-right-align" placeholder="0,00">
          <span matTextPrefix>g&nbsp;</span>
        </mat-form-field>

      </div>

      <div class="form-column">

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Quantidade Ideal</mat-label>
          <input matInput formControlName="quantidadeProduto" placeholder="Quantidade Ideal" id="quantidadeProduto" name="quantidadeProduto" placeholder="0">
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Valor Unitário</mat-label>
          <input currencyMask [options]="{ prefix: 'R$', thousands: '.', decimal: ',', aling:'left', allowNegative: false}" matInput type="text" formControlName="valorProduto" class="example-right-align">
          <span matTextPrefix>R$&nbsp;</span>
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
        <mat-label>Quantidade Por Caixa</mat-label>
        <input matInput formControlName="quantidadePorCaixa" placeholder="Quantidade por caixa" id="quantidadePorCaixa" name="quantidadePorCaixa" placeholder="0">
      </mat-form-field>

      </div>
    </form>
  </mat-card-content>
  <mat-card-actions class="actions-container">
    <button mat-raised-button color="primary" style="background-color: #64C2A8; color:white;" (click)="enviar()">Salvar</button>
    <button  mat-raised-button style="margin-left: 8px;" (click)="cancelar()">Cancelar</button>
  </mat-card-actions>
</mat-card>
