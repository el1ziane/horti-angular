<h1 mat-dialog-title>Detalhes do Item</h1>
<div mat-dialog-content>
  <p>Código: {{data.codigoEstoque}}</p>
  <p>Produto: {{data.produtoEstoque}}</p>
  <p>Quantidade: {{data.quantidadeEstoque}}</p>
  <p>Valor Unitrio: {{data.valorUnitarioEstoque}}</p>
  <p>Valor Total: {{data.valorTotalEstoque}}</p>
  <p>Data: {{data.dataEstoque}}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Fechar</button>
</div>
