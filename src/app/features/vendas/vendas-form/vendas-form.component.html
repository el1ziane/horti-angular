<mat-card>
  <mat-card-header>
    <mat-card-title>Detalhes da Venda</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" class="form-columns">
      <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Código</mat-label>
          <input matInput formControlName="codigoVenda" placeholder="Código" id="codigoVenda" name="codigoVenda">
        </mat-form-field>
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Produto</mat-label>
          <mat-error *ngIf="form.get('produtoVenda')?.hasError('notFound')">
            Produto não encontrado. Cadastre o item na tela de produto.
          </mat-error>
          <mat-select formControlName="produtoVenda"
                      placeholder="Produto"
                      id="produtoVenda"
                      name="produtoVenda"
                      (selectionChange)="onProdutoChange($event.value)">
            <mat-option *ngFor="let produto of filteredProdutos" [value]="produto">
              {{ produto.produtoNome }}

            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Quantidade</mat-label>
          <input matInput formControlName="quantidadeVenda" placeholder="Quantidade Vendida" id="quantidadeVenda"
            name="quantidadeVenda" type="number">
        </mat-form-field>
      </div>

      <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Valor de venda(Unitário)</mat-label>
          <input currencyMask
            [options]="{ prefix: 'R$', thousands: '.', decimal: ',', aling:'left', allowNegative: false}" matInput
            type="text" formControlName="valorVenda" class="example-right-align">
          <span matTextPrefix>R$&nbsp;</span>
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Status</mat-label>
          <mat-select formControlName="statusVenda" id="statusVenda" name="statusVenda">
            <mat-option value="Pago">Pago</mat-option>
            <mat-option value="Pendente">Pendente</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Selecione o período</mat-label>
          <mat-date-range-input [formGroup]="form" [rangePicker]="picker">
            <input matStartDate matInput formControlName="dataInicial" placeholder="Data Inicial">
            <input matEndDate matInput formControlName="dataFinal" placeholder="Data Final">
          </mat-date-range-input>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
        </mat-form-field>
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions class="actions-container">
    <button mat-raised-button color="primary" style="background-color: #64C2A8; color:white;"
      (click)="enviar()">Salvar</button>
    <button mat-raised-button style="margin-left: 8px;" (click)="cancelar()">Cancelar</button>
  </mat-card-actions>
</mat-card>
