<h1 mat-dialog-title>Detalhes da Estimativa</h1>
<div mat-dialog-content>
  <p>Produto: {{data.produtoEstimativa?.produtoNome}}</p>
  <p>Quantiade de caixa: {{data.caixaEstimativa}}</p>
  <p>Peso (g): {{data.pesoEstimativa}}</p>
  <p>Quantiade estimada: {{data.resultado}}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Fechar</button>
</div>
