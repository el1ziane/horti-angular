<mat-card>
  <mat-card-header style="background-color: white">
    <mat-card-title>Lista de Produção</mat-card-title>
  </mat-card-header>
  <mat-toolbar style="background-color: white">
    <button mat-flat-button color="primary" style="background-color: #0fac65c0; color: white; margin-right: 16px;" (click)="onAdd()">
      <mat-icon>add</mat-icon>
      <span>Adicionar</span>
    </button>
    <div [ngStyle]="{ 'display': 'none' }" id="print-section">
      <h1>Relatório de Produção</h1>
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr>
            <th style="border: 1px solid #000; padding: 8px;">Código</th>
            <th style="border: 1px solid #000; padding: 8px;">Produto</th>
            <th style="border: 1px solid #000; padding: 8px;">Qtd Produzida</th>
            <th style="border: 1px solid #000; padding: 8px;">Data</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let producao of producaoService.getProducaoParaRelatorio(); let i = index">
            <td style="border: 1px solid #000; padding: 8px;">{{ producao.codigoProducao}}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{ producao.produtoProducao }}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{ producao.quantidadeProducao }}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{ producao.dataProducao }}</td>
          </tr>

        </tbody>
      </table>
    </div>

    <button mat-button
    (click)="onReport()"mat-flat-button color="primary" style="background-color: #0fac65c0; color: white; margin-left: 16px;" ngxPrint><mat-icon>open_in_browser</mat-icon><span>Relatório</span></button>

    <div class="search-container">
      <form action="">
        <input matInput (keyup)="applyFilter($event)" placeholder="Buscar..." #input>
      </form>
    </div>
  </mat-toolbar>

  <div class="column-flex" class="mat-elevation-z8">
    <app-producao-lista
    *ngIf="producao$ | async as producao; else loading"
    [dataSource]="dataSource"
    (add)="onAdd()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)">
  </app-producao-lista>
    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner color="foreground"></mat-spinner>
      </div>
    </ng-template>
  </div>
</mat-card>
