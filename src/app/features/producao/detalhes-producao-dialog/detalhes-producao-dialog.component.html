<h1 mat-dialog-title>Detalhes da Produção</h1>
<div mat-dialog-content>
  <p>Data: {{data.dataProducao}}</p>
  <p>Produto: {{data.produtoProducao?.produtoNome}}</p>
  <p>Quantidade: {{data.quantidadeProducao}}</p>
  <p>Código: {{data.codigoProducao}}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Fechar</button>
</div>
