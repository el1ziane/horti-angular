<div class="column-flex mat-elevation-z8">
  <div class="tabela-list">
    <div *ngFor="let producao of producoes" class="tabela-item">
      <div class="tabela-header" (click)="toggleDetails(producao)">
        <div class="tabela-info">
          <span>{{ producao.produtoProducao }}</span>
        </div>
        <button mat-icon-button [matMenuTriggerFor]="opcoesMenu">
          <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #opcoesMenu="matMenu" [overlapTrigger]="false">
          <button mat-menu-item (click)="onEdit(producao)">
            <mat-icon>edit_square</mat-icon><span>Editar</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onDelete(producao)">
            <mat-icon>delete</mat-icon><span>Excluir</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="openDetailsDialog(producao)">
            <mat-icon>info</mat-icon><span>Detalhes</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </div>

  <mat-table [dataSource]="producoes" class="mat-table">
    <ng-container matColumnDef="codigoProducao">
      <mat-header-cell *matHeaderCellDef> Código </mat-header-cell>
      <mat-cell *matCellDef="let producao"> {{producao.codigoProducao}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="produtoProducao">
      <mat-header-cell *matHeaderCellDef> Produto </mat-header-cell>
      <mat-cell *matCellDef="let producao"> {{producao.produtoProducao}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="quantidadeProducao">
      <mat-header-cell *matHeaderCellDef> Quantidade </mat-header-cell>
      <mat-cell *matCellDef="let producao"> {{producao.quantidadeProducao}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="dataProducao">
      <mat-header-cell *matHeaderCellDef> Data </mat-header-cell>
      <mat-cell *matCellDef="let producao"> {{producao.dataProducao}} </mat-cell>
    </ng-container>



    <ng-container matColumnDef="acoes">
      <mat-header-cell *matHeaderCellDef class="action-column-header"></mat-header-cell>
      <mat-cell *matCellDef="let producao" class="action-column">
        <button mat-icon-button="Primary" style="color: #64C2A8" aria-label="Editar" (click)="onEdit(producao)">
          <mat-icon>edit_square</mat-icon>
        </button>
        <button mat-icon-button="Primary" style="color: #D66767" aria-label="Remover" (click)="onDelete(producao)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>
</div>
