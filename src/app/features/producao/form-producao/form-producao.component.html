<mat-card>
  <mat-card-header>
    <mat-card-title>Detalhes da Produção</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" class="form-columns">
      <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Código</mat-label>
          <input matInput formControlName="codigoProducao" placeholder="Código" id="codigoProducao" name="codigoProducao" >

        </mat-form-field>
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Produto</mat-label>
          <mat-select formControlName="produtoProducao"
                      placeholder="Produto"
                      id="produtoProducao"
                      name="produtoProducao"
                      (selectionChange)="onProdutoChange($event.value)">
            <mat-option *ngFor="let produto of filteredProdutos" [value]="produto">
              {{ produto.produtoNome }}

            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Quantidade</mat-label>
          <input matInput formControlName="quantidadeProducao" placeholder="Producao" id="quantidadeProducao" name="quantidadeProducao" placeholder="0">

        </mat-form-field>
               <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Data</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dataProducao">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

      </div>
    </form>
  </mat-card-content>
  <mat-card-actions class="actions-container">
    <button mat-raised-button color="primary" style="background-color: #98BAE6; color:white;" (click)="enviar()">Salvar</button>
    <button  mat-raised-button style="margin-left: 8px;" (click)="cancelar()">Cancelar</button>
  </mat-card-actions>
</mat-card>
