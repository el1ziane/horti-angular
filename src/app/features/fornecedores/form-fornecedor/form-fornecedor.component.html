<mat-card>
  <mat-card-header>
    <mat-card-title>Detalhes do Fornecedor</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" class="form-columns">

      <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Fornecedor</mat-label>
          <input matInput formControlName="fornecedorNome" placeholder="Fornecedor" id="fornecedorNome" name="fornecedorNome">
        </mat-form-field>


        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>CNPJ</mat-label>
          <input matInput mask="00.000.000/0000-00" formControlName="cnpj" placeholder="CNPJ" id="cnpj" name="cnpj">
        </mat-form-field>
      </div>
        <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" placeholder="(00) 00000-0000" id="telefone" name="telefone" mask="(00) 00000-0000">
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>E-mail</mat-label>
          <input matInput formControlName="email" placeholder="E-mail" id="email" name="email">
        </mat-form-field>

      </div>
    </form>
  </mat-card-content>
  <mat-card-actions class="actions-container">
    <button mat-raised-button color="primary" style="background-color: #98BAE6; color:white;" (click)="enviar()">Salvar</button>
    <button  mat-raised-button style="margin-left: 8px;" (click)="cancelar()">Cancelar</button>
  </mat-card-actions>
</mat-card>
