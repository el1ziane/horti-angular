<div class="column-flex mat-elevation-z8">
  <div class="tabela-list">
    <div *ngFor="let fornecedor of dataSource.data" class="tabela-item">
      <div class="tabela-header" (click)="toggleDetails(fornecedor)">
        <div class="tabela-info">
          <span>{{ fornecedor.fornecedorNome }}</span>
          <span>{{ fornecedor.email }}</span>
        </div>
        <button mat-icon-button [matMenuTriggerFor]="opcoesMenu">
          <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #opcoesMenu="matMenu" [overlapTrigger]="false">
          <button mat-menu-item (click)="onEdit(fornecedor)">
            <mat-icon>edit_square</mat-icon><span>Editar</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onDelete(fornecedor)">
            <mat-icon>delete</mat-icon><span>Excluir</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="openDetailsDialog(fornecedor)">
            <mat-icon>info</mat-icon><span>Detalhes</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </div>
<mat-table [dataSource]="dataSource" class="mat-table" matSort >
  <ng-container matColumnDef="fornecedorNome">
    <mat-header-cell *matHeaderCellDef  mat-sort-header> Fornecedor </mat-header-cell>
    <mat-cell *matCellDef="let fornecedor"> {{fornecedor.fornecedorNome}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="cnpj">
    <mat-header-cell *matHeaderCellDef  mat-sort-header> CNPJ </mat-header-cell>
    <mat-cell *matCellDef="let fornecedor"> {{formatarCNPJ(fornecedor.cnpj)}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="telefone">
    <mat-header-cell *matHeaderCellDef  mat-sort-header> Telefone </mat-header-cell>
    <mat-cell *matCellDef="let fornecedor"> {{formatarTelefone(fornecedor.telefone)}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="email">
    <mat-header-cell *matHeaderCellDef  mat-sort-header> E-mail </mat-header-cell>
    <mat-cell *matCellDef="let fornecedor"> {{fornecedor.email}} </mat-cell>
  </ng-container>

  <ng-container  matColumnDef="acoes">
    <mat-header-cell *matHeaderCellDef class="action-column-header">

    </mat-header-cell>

    <mat-cell *matCellDef="let produto" class="action-column">
      <button mat-icon-button="Primary" style="color: #64C2A8" aria-label="Editar" (click)="onEdit(produto)">
        <mat-icon >edit_square</mat-icon>
      </button>
      <button mat-icon-button="Primary" style="color: #D66767" aria-label="Remover" (click)="onDelete(produto)">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
</mat-table>
<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
