<h1 mat-dialog-title>Detalhes da Compra</h1>
<div mat-dialog-content>
  <p>Data: {{data.dataCompra}}</p>
  <p>Produto: {{data.produtoCompra?.produtoNome}}</p>
  <p>Fornecedor: {{data.fornecedorCompra}}</p>
  <p>Valor da Compra: {{data.valorCompra}}</p>
  <p>Status de Pagamento: {{data.status}}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Fechar</button>
</div>
