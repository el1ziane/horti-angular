<mat-card>
  <mat-card-header>
    <mat-card-title>Detalhes da Despesa</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" class="form-columns">

      <div class="form-column">
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Fornecedor</mat-label>
          <input matInput formControlName="fornecedorDespesa" placeholder="Fornecedor" id="fornecedorDespesa"
            name="fornecedorDespesa">
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Descrição</mat-label>
          <input matInput formControlName="descricaoDespesa" placeholder="Descrição" id="descricaoDespesa"
            name="descricaoDespesa">
        </mat-form-field>
        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Valor</mat-label>
          <input currencyMask [options]="{ prefix: 'R$', thousands: '.', decimal: ',', aling:'left', allowNegative: false}" matInput type="text" formControlName="valorDespesa" class="example-right-align">
          <span matTextPrefix>R$&nbsp;</span>
        </mat-form-field>
      </div>

      <div class="form-column">
          <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Data</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dataDespesa">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-form-field">
          <mat-label>Status</mat-label>
          <mat-select formControlName="statusDespesa" id="statusDespesa" name="statusDespesa">
            <mat-option value="Pago">Pago</mat-option>
            <mat-option value="Pendente">Pendente</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions class="actions-container">
    <button mat-raised-button color="primary" style="background-color: #64C2A8; color:white;"
      (click)="enviar()">Salvar</button>
    <button mat-raised-button style="margin-left: 8px;" (click)="cancelar()">Cancelar</button>
  </mat-card-actions>
</mat-card>
