<div class="column-flex mat-elevation-z8">
  <div class="tabela-list">
    <div *ngFor="let compra of dataSource.data" class="tabela-item">
      <div class="tabela-header" (click)="toggleDetails(compra)">
        <div class="tabela-info">
          <span>{{ compra.produto?.produtoNome }}</span>
          <span>{{ compra.dataRecebimento}}</span>
        </div>
        <button mat-icon-button [matMenuTriggerFor]="opcoesMenu">
          <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #opcoesMenu="matMenu" [overlapTrigger]="false">
          <button mat-menu-item (click)="onEdit(compra)">
            <mat-icon>edit_square</mat-icon><span>Editar</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onDelete(compra)">
            <mat-icon>delete</mat-icon><span>Excluir</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="openDetailsDialog(compra)">
            <mat-icon>info</mat-icon><span>Detalhes</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </div>

  <mat-table [dataSource]="dataSource" class="mat-table" matSort>
    <!-- Definições de colunas -->
    <ng-container matColumnDef="fornecedorRec">
      <mat-header-cell *matHeaderCellDef> Fornecedor </mat-header-cell>
      <mat-cell *matCellDef="let compra"> {{compra.fornecedorRec}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="produto">
      <mat-header-cell *matHeaderCellDef> Produto </mat-header-cell>
      <mat-cell *matCellDef="let compra"> {{compra.produto?.produtoNome}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="quantidadeRecebimento">
      <mat-header-cell *matHeaderCellDef> Quantidade </mat-header-cell>
      <mat-cell *matCellDef="let compra"> {{compra.quantidadeRecebimento}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="valorRecebimento">
      <mat-header-cell *matHeaderCellDef> Valor </mat-header-cell>
      <mat-cell *matCellDef="let compra"> R${{ compra.valorRecebimento | decimalVirgula }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="dataRecebimento">
      <mat-header-cell *matHeaderCellDef> Data </mat-header-cell>
      <mat-cell *matCellDef="let compra"> {{compra.dataRecebimento}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let compra">{{compra.status}}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <mat-header-cell *matHeaderCellDef class="action-column-header"></mat-header-cell>
      <mat-cell *matCellDef="let compra" class="action-column">
        <button mat-icon-button="Primary" style="color: #64C2A8" aria-label="Editar" (click)="onEdit(compra)">
          <mat-icon>edit_square</mat-icon>
        </button>
        <button mat-icon-button="Primary" style="color: #D66767" aria-label="Remover" (click)="onDelete(compra)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[20, 30, 40]" showFirstLastButtons></mat-paginator>
</div>
