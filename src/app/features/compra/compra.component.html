<mat-card>
  <mat-card-header style="background-color: white">
    <mat-card-title>Compras e Despesas</mat-card-title>

  </mat-card-header>

  <mat-toolbar style="background-color: white">

    <button mat-flat-button color="primary" style="background-color: #0fac65c0; color: white; margin-right: 16px;" (click)="onAdd()">
      <mat-icon>add</mat-icon>
      <span>Adicionar</span>
    </button>
    <div [ngStyle]="{ 'display': 'none' }" id="print-section">
      <h1>Relatório de Compras</h1>
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr>
            <th style="border: 1px solid #000; padding: 8px;">Forncedor</th>
            <th style="border: 1px solid #000; padding: 8px;">Produto</th>
            <th style="border: 1px solid #000; padding: 8px;">Qtd</th>
            <th style="border: 1px solid #000; padding: 8px;">Valor</th>
            <th style="border: 1px solid #000; padding: 8px;">Data</th>
            <th style="border: 1px solid #000; padding: 8px;">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let compra of compraService.getCompraParaRelatorio(); let i = index">
            <td style="border: 1px solid #000; padding: 8px;">{{ compra.fornecedorRec }}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{ compra.produto?.produtoNome }}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{ compra.quantidadeRecebimento }}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{compra.valorRecebimento }}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{ compra.dataRecebimento }}</td>
            <td style="border: 1px solid #000; padding: 8px;">{{ compra.status }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <button mat-button (click)="onReport()" mat-flat-button color="primary"
      style="background-color: #0fac65c0; color: white; margin-left: 16px;" ngxPrint>
      <mat-icon>open_in_browser</mat-icon>
      <span>Relatório</span>
    </button>
    <div class="search-container">
      <form action="">

        <input matInput (keyup)="applyFilter($event)" placeholder="Buscar..." #input>


      </form>
    </div>



  </mat-toolbar>

  <mat-tab-group [(selectedIndex)]="selectedIndex" (selectedTabChange)="onTabChange($event)">
    <mat-tab label="Compras">
      <app-compra-lista *ngIf="compras$ | async as compra; else loading"
      [dataSource]="compraDataSource"
      (add)="onAdd()"
      (edit)="onEdit($event, 'compra')"
      (delete)="onDelete($event, 'compra')"></app-compra-lista>
    </mat-tab>

    <mat-tab label="Despesas">
      <app-despesa-lista  *ngIf="despesas$ | async as despesa; else loading"
      [dataSource]="despesaDataSource"
      (add)="onAdd()"
      (edit)="onEdit($event, 'despesa')"
      (delete)="onDelete($event, 'despesa')" ></app-despesa-lista>
    </mat-tab>

  </mat-tab-group>
  <ng-template #loading>
    <div class="loading-spinner">
      <mat-spinner color="foreground"></mat-spinner>
    </div>
  </ng-template>
</mat-card>
