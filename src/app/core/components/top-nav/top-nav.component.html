<mat-toolbar style="background-color: #64C2A8" class="fix-nav">
  <button type="button" mat-icon-button (click)="toggleSidebar()">
      <mat-icon>menu</mat-icon>
  </button>
  <span>Sistema de Horti Fruti</span>
  <span class="toolbar-item-spacer"></span>
  
  <button mat-icon-button matTooltip="My Account" [matMenuTriggerFor]="userAccountMenu">
      <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userAccountMenu [overlapTrigger]="false" yPosition="below">
    <button mat-menu-item [routerLink]="['minha-conta', userId]">
          <mat-icon>person</mat-icon><span>Minha Conta</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="onLoggedout()">
          <mat-icon>exit_to_app</mat-icon>Sair
      </button>
  </mat-menu>
</mat-toolbar>
