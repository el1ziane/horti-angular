
<mat-table [dataSource]="recebimentos" >


  <ng-container matColumnDef="fornecedor">
    <mat-header-cell *matHeaderCellDef> Fornecedor </mat-header-cell>
    <mat-cell *matCellDef="let recebimento"> {{recebimento.fornecedor}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="produto">
    <mat-header-cell *matHeaderCellDef> Produto </mat-header-cell>
    <mat-cell *matCellDef="let recebimento"> {{recebimento.produto}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="quantidadeRecebimento">
    <mat-header-cell *matHeaderCellDef> Quantidade </mat-header-cell>
    <mat-cell *matCellDef="let recebimento"> {{recebimento.quantidadeRecebimento}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="valorRecebimento" >
    <mat-header-cell *matHeaderCellDef> Valor </mat-header-cell>
    <mat-cell *matCellDef="let recebimento"> {{recebimento.valorRecebimento}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="dataRecebimento">
    <mat-header-cell *matHeaderCellDef> Data </mat-header-cell>
    <mat-cell *matCellDef="let recebimento"> {{recebimento.dataRecebimento}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="status" >
    <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
    <mat-cell *matCellDef="let recebimento">

    </mat-cell>
  </ng-container>

  <ng-container  matColumnDef="acoes">
    <mat-header-cell *matHeaderCellDef class="action-column-header">

    </mat-header-cell>

    <mat-cell *matCellDef="let recebimento" class="action-column">
      <button mat-icon-button="Primary" style="color: #64C2A8" aria-label="Editar" (click)="onEdit(recebimento)">
        <mat-icon >edit_square</mat-icon>
      </button>
      <button mat-icon-button="Primary" style="color: #D66767" aria-label="Remover" (click)="onDelete(recebimento)">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>


</mat-table>
